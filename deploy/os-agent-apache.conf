# Apache config for the OS monitoring agent web UI.
#
# Install:
#   sudo cp os-agent-apache.conf /etc/httpd/conf.d/os-agent.conf
#   sudo systemctl restart httpd
#
# Requires mod_proxy and mod_proxy_http (enabled by default on RHEL 9's httpd).
# If SELinux is enforcing, also run:
#   sudo setsebool -P httpd_can_network_connect 1
# (needed so Apache is allowed to proxy to the local Gunicorn port)

<VirtualHost *:80>
    ServerName os-agent.local
    # Change ServerName to your actual hostname/IP if needed, or remove
    # this line entirely to catch all requests on port 80.

    # --- Reverse proxy API calls to Gunicorn/Flask ---
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8800/api
    ProxyPassReverse /api http://127.0.0.1:8800/api

    # --- Everything else: serve the static frontend directly ---
    DocumentRoot /home/test/opt/os-agent/static
    <Directory /home/test/opt/os-agent/static>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/os-agent-error.log
    CustomLog /var/log/httpd/os-agent-access.log combined
</VirtualHost>
